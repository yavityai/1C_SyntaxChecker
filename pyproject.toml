[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syntaxcheck-mcp"
version = "1.1.0"
description = "MCP server for BSL syntax checking via BSL Language Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.8.0",
]

[project.scripts]
syntaxcheck-mcp = "syntaxcheck_mcp.__main__:main"
syntaxcheck = "syntaxcheck_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
