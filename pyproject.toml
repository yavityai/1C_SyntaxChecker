[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syntaxcheck-mcp"
version = "1.0.0"
description = "MCP server for BSL syntax checking via BSL Language Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.8.0",
]

[project.scripts]
syntaxcheck-mcp = "syntaxcheck_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
